<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#1c2128"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#79c0ff"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0883e"/>
      <stop offset="100%" stop-color="#ffa657"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#21262d" stroke-width="1">
    <line x1="0" y1="80"   x2="1280" y2="80"/>
    <line x1="0" y1="160"  x2="1280" y2="160"/>
    <line x1="0" y1="240"  x2="1280" y2="240"/>
    <line x1="0" y1="320"  x2="1280" y2="320"/>
    <line x1="0" y1="400"  x2="1280" y2="400"/>
    <line x1="0" y1="480"  x2="1280" y2="480"/>
    <line x1="0" y1="560"  x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- waveform: represents XCP DAQ streaming -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 60 380 L 160 380 L 180 300 L 220 300 L 240 380 L 340 380 L 360 260 L 400 260 L 420 380 L 520 380 L 540 320 L 580 320 L 600 380 L 700 380 L 720 290 L 760 290 L 780 380 L 880 380 L 900 340 L 940 340 L 960 380 L 1060 380 L 1080 300 L 1120 300 L 1140 380 L 1220 380"
          stroke="url(#accent)" stroke-width="3" opacity="0.65"/>
    <path d="M 60 420 L 180 420 L 200 360 L 240 360 L 260 420 L 380 420 L 400 340 L 440 340 L 460 420 L 580 420 L 600 380 L 640 380 L 660 420 L 780 420 L 800 350 L 840 350 L 860 420 L 980 420 L 1000 380 L 1040 380 L 1060 420 L 1220 420"
          stroke="url(#warm)" stroke-width="2.5" opacity="0.45"/>
  </g>

  <!-- title -->
  <text x="80" y="180" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="72" font-weight="700" fill="#e6edf3" letter-spacing="2">xcp-slave</text>
  <text x="80" y="235" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="26" fill="#8b949e" letter-spacing="4">ASAM XCP PART 2 v1.1  ·  AUTOSAR R4.4.0</text>

  <!-- subtitle -->
  <text x="80" y="500" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="20" fill="#6e7681" letter-spacing="1">STD · CAL · PAG · DAQ · STIM · PGM · SEED&amp;KEY · RESUME</text>
  <text x="80" y="540" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="20" fill="#6e7681" letter-spacing="1">CAN · FLEXRAY · ETHERNET · CDD</text>

  <!-- badge -->
  <g transform="translate(80,585)">
    <rect width="240" height="34" rx="17" fill="none" stroke="#f0883e" stroke-width="1.5"/>
    <text x="120" y="22" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="15" fill="#ffa657" text-anchor="middle" letter-spacing="2">AI-GENERATED</text>
  </g>
  <g transform="translate(340,585)">
    <rect width="140" height="34" rx="17" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="70" y="22" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="15" fill="#79c0ff" text-anchor="middle" letter-spacing="2">C99 · MIT</text>
  </g>

  <!-- decorative packet bytes top-right -->
  <g font-family="Consolas,'SF Mono',Menlo,monospace" font-size="14" fill="#30363d" text-anchor="end">
    <text x="1200" y="60">FF 1D 80 08 08 00 01 01</text>
    <text x="1200" y="84">FD 44 1D 00 34 12</text>
    <text x="1200" y="108">D5 00 02 00 · D4 · D3 · E1 · E0</text>
    <text x="1200" y="132">DE DD DC DB DA D9 D8</text>
  </g>
</svg>
